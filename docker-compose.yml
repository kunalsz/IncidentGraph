services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: incidentgraph-falkordb
    ports:
      - "6380:6379"   # redis protocol (graph queries)
      - "3001:3000"   # bundled FalkorDB Browser UI
    volumes:
      - falkordb_data:/data

  # api and web are added on Day 2/3 (engine + UI phases)
